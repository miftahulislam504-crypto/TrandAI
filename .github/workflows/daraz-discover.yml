name: Daraz Category Discovery

# Daraz-এর আসল ক্যাটাগরি slug খুঁজে seed প্রস্তাব করে। DB লাগে না।
# Actions ট্যাব -> Daraz Category Discovery -> Run workflow। ২০-৩০ মিনিট লাগতে পারে (২৪০ রিকোয়েস্ট)।
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scrapers/requirements.txt
      - name: Unit tests
        env:
          RUN_OUT: ${{ runner.temp }}/test-output
        run: python -m unittest discover -s scrapers/tests -t .
      - name: Discover categories
        run: python -m scrapers.run_discover
      - name: Add report to run summary
        if: always()
        run: |
          if [ -f run-output/daraz-categories.md ]; then cat run-output/daraz-categories.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daraz-categories
          path: run-output/
          retention-days: 30
